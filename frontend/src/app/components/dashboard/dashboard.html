<mat-toolbar>
    <span>Kanji Dojo</span>
    <span class="spacer"></span>
    <button mat-button (click)="logout()">Logout</button>
</mat-toolbar>

<div class="content">
    <mat-card>
        <mat-card-header>
            <mat-card-title>Reviews</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <p class="due">{{ cards().length }}</p>
            <p>cards due for review</p>
        </mat-card-content>
        <mat-card-actions>
            <a mat-flat-button routerLink="/review" [disabled]="!cards().length">Start review</a>
        </mat-card-actions>
    </mat-card>
</div>
