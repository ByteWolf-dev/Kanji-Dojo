<mat-card class="login">
  <mat-card-header>
    <mat-card-title>Kanji Dojo</mat-card-title>
    <mat-card-subtitle>漢字道場</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <form #loginForm="ngForm" (ngSubmit)="login()">

      <mat-form-field appearance="outline">
        <mat-label>Username</mat-label>
        <input
          matInput
          type="text"
          name="username"
          [(ngModel)]="credentials.name"
          autocomplete="username"
          required
        />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input
          matInput
          type="password"
          name="password"
          [(ngModel)]="credentials.password"
          autocomplete="current-password"
          required
        />
      </mat-form-field>

      @if (errorMessage()) {
        <p class="error">{{ errorMessage() }}</p>
      }

      <button
        mat-flat-button
        type="submit"
        [disabled]="isLoading() || loginForm.invalid"
      >
        {{ isLoading() ? 'Logging in...' : 'Login' }}
      </button>

    </form>

    <p class="demo">
      Just looking around?
      <button mat-button type="button" (click)="loginAsDemo()" [disabled]="isLoading()">Try the demo</button>
    </p>
  </mat-card-content>

  <mat-card-actions>
    <a mat-button routerLink="/about">About</a>
  </mat-card-actions>
</mat-card>
