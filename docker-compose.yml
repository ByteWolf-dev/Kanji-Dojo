services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    volumes:
      - kanji-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  api:
    build: ./backend/backend
    environment:
      ConnectionStrings__KanjiDb: "Server=db;Database=KanjiDB;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:10100:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  kanji-data:
